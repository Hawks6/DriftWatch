[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-driftwatch"
version = "0.1.0"
description = "Real-time memory health monitor and context rot detector for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Praveen", email = "gpraveen6828@gmail.com" }]
keywords = [
    "anthropic",
    "claude",
    "ai-agents",
    "memory",
    "context",
    "drift",
    "monitoring",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "anthropic>=0.50.0",
    # sentence-transformers 3.x + transformers <4.46 = compatible with torch>=2.1
    # If you have torch>=2.2 installed you can relax these to latest.
    "sentence-transformers>=3.0.0,<4.0.0",
    "transformers>=4.41.0,<4.46.0",
    "numpy>=1.26.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "jsonlines>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
driftwatch = "driftwatch.cli:main"

[project.urls]
Homepage = "https://github.com/hawks6/driftwatch"
Repository = "https://github.com/hawks6/driftwatch"
"Bug Tracker" = "https://github.com/hawks6/driftwatch/issues"
Documentation = "https://github.com/hawks6/driftwatch#readme"

[tool.hatch.build.targets.wheel]
packages = ["driftwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
